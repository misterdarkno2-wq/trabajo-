<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../engine/lib.css">
<style>body{background:#1a0b17} .pl{position:absolute;width:520px;height:660px} .pl svg{width:100%;height:100%}</style></head>
<body><div id="stage"></div>
<script src="../engine/lib.js"></script><script src="../engine/botanica.js"></script>
<script>
const st=document.getElementById('stage');
const names=['rockRose','mimulus','cherryPlum','aspen','redChestnut'];
const ctl=names.map((n,i)=>{const d=P.el('div','pl',st);d.style.left=(i%2)*540+10+'px';d.style.top=Math.floor(i/2)*640+'px';return B.mount(d,n);});
window.renderFrame=async t=>{ctl.forEach(c=>c.draw(t,0,1.8,0.55));};
</script></body></html>
